name: Update Contribution Activity Graph

on:
  schedule:
    # Run daily at 00:00 UTC (05:30 IST).
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: >-
            bg_color=070B16&
            color=7DD3FC&
            line=247BFF&
            point=FFFFFF&
            area=true&
            area_color=123B78&
            hide_border=true&
            custom_title=Contribution%20Activity&
            radius=8&
            height=300
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated graph to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
